services:
  - type: web
    name: sarvam-game
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SARVAM_API_KEY
        sync: false   # Render asks for the value; it never goes in the repo
      - key: PYTHON_VERSION
        value: 3.12.7
