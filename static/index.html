<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varnamala – Learn Hindi by Voice</title>
<style>
  :root { --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --red:#ff4b4b; --gold:#ffc800; --ink:#3c3c3c; --line:#e5e5e5; --bg:#f7f7f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#fff; border-bottom:2px solid var(--line); position:sticky; top:0; z-index:5; }
  .bar { max-width:760px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:16px; }
  .logo { font-weight:800; color:var(--green); font-size:22px; margin-right:auto; }
  .stat { font-weight:800; font-size:16px; }
  nav { max-width:760px; margin:0 auto; display:flex; gap:6px; padding:0 16px 10px; }
  nav button { flex:1; padding:10px 6px; border:2px solid var(--line); background:#fff; border-radius:12px; font-weight:700; color:#777; cursor:pointer; }
  nav button.active { border-color:var(--blue); color:var(--blue); background:#ddf4ff; }
  nav button:disabled { opacity:.5; cursor:not-allowed; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .progress { background:var(--line); height:14px; border-radius:99px; overflow:hidden; margin:6px 0 4px; }
  .progress i { display:block; height:100%; background:var(--green); width:0; transition:width .4s; }
  .sub { color:#777; font-size:14px; margin:0 0 14px; }
  h2 { margin:18px 0 8px; font-size:16px; text-transform:uppercase; letter-spacing:.05em; color:#999; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:10px; }
  .tile { background:#fff; border:2px solid var(--line); border-bottom-width:5px; border-radius:16px; padding:10px 4px; text-align:center; cursor:pointer; position:relative; }
  .tile:active { transform:translateY(2px); border-bottom-width:3px; }
  .tile b { font-size:34px; display:block; line-height:1.2; }
  .tile span { font-size:13px; color:#888; }
  .tile.done { border-color:var(--green); background:#e8f9d4; }
  .tile.done::after { content:"✓"; position:absolute; top:2px; right:8px; color:var(--green-d); font-weight:800; }
  .soon { text-align:center; padding:60px 20px; color:#888; }
  .soon big { font-size:56px; display:block; }
  /* lesson overlay */
  #lesson { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  #lesson.open { display:flex; }
  .card { background:#fff; width:100%; max-width:560px; border-radius:24px 24px 0 0; padding:22px 20px 28px; max-height:94vh; overflow:auto; }
  .card .top { display:flex; justify-content:space-between; align-items:center; }
  .x { border:0; background:none; font-size:26px; cursor:pointer; color:#999; }
  .big { font-size:110px; text-align:center; line-height:1.1; margin:6px 0; }
  .hint { text-align:center; font-size:20px; font-weight:700; color:var(--blue); }
  .hint.hidden { visibility:hidden; }
  .word { text-align:center; margin:14px 0 4px; font-size:30px; font-weight:700; }
  .word small { display:block; font-size:15px; color:#888; font-weight:500; }
  .row { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; padding:14px; border:0; border-bottom:4px solid; border-radius:14px; font-weight:800; font-size:16px; cursor:pointer; text-transform:uppercase; letter-spacing:.03em; }
  .btn:active { transform:translateY(2px); border-bottom-width:2px; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .btn.blue { background:var(--blue); border-color:#1899d6; color:#fff; }
  .btn.green { background:var(--green); border-color:var(--green-d); color:#fff; }
  .btn.ghost { background:#fff; border-color:var(--line); color:#777; border:2px solid var(--line); border-bottom-width:4px; }
  .btn.rec { background:var(--red); border-color:#d33; color:#fff; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.7; } }
  .toggle { text-align:center; margin-top:14px; font-size:14px; color:#888; }
  .toggle label { cursor:pointer; }
  #result { margin-top:16px; border-radius:16px; padding:14px; display:none; }
  #result.ok { display:block; background:#d7ffb8; color:#58a700; }
  #result.bad { display:block; background:#ffdfe0; color:#ea2b2b; }
  #result.err { display:block; background:#fff3cd; color:#8a6d00; }
  #result b { font-size:18px; display:block; }
  #result small { color:inherit; opacity:.85; }
  .pop { position:fixed; left:50%; top:30%; transform:translateX(-50%); font-size:54px; pointer-events:none; animation:rise 1.2s forwards; z-index:20; font-weight:800; color:var(--gold); text-shadow:0 2px 0 #b38f00; }
  @keyframes rise { to { top:12%; opacity:0; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">वर्णमाला</div>
    <div class="stat" title="Day streak">🔥 <span id="streak">0</span></div>
    <div class="stat" title="XP">⭐ <span id="xp">0</span></div>
    <div class="stat" title="Level">Lv <span id="level">1</span></div>
  </div>
  <nav>
    <button class="active" data-tab="alphabet">🔤 Alphabet</button>
    <button data-tab="practice" disabled>🎯 Practice (soon)</button>
    <button data-tab="story" disabled>📖 Story (soon)</button>
  </nav>
</header>

<main id="alphabet">
  <div class="progress"><i id="bar"></i></div>
  <p class="sub"><span id="count">0</span> of <span id="total">0</span> letters learned · tap a letter to start</p>
  <h2>Vowels · स्वर</h2>
  <div class="grid" id="vowels"></div>
  <h2>Consonants · व्यंजन</h2>
  <div class="grid" id="consonants"></div>
</main>

<div id="lesson">
  <div class="card">
    <div class="top"><span class="sub" id="lessonTitle"></span><button class="x" id="close">✕</button></div>
    <div class="big" id="letter"></div>
    <div class="hint" id="hint"></div>
    <div class="word"><span id="word"></span><small id="meaning"></small></div>
    <div class="row">
      <button class="btn blue" id="hearLetter">🔊 Letter</button>
      <button class="btn blue" id="hearWord">🔊 Word</button>
      <button class="btn ghost" id="hearSlow">🐢 Slow</button>
    </div>
    <div class="row"><button class="btn green" id="mic">🎤 Say the word</button></div>
    <div class="toggle"><label><input type="checkbox" id="hintsOn" checked> Show hints (turn off for a challenge)</label></div>
    <div id="result"></div>
  </div>
</div>

<script>
// letter, hint (romanised), example word, word hint, meaning
const VOWELS = [
  ["अ","a","अनार","anaar","pomegranate"], ["आ","aa","आम","aam","mango"], ["इ","i","इमली","imli","tamarind"],
  ["ई","ee","ईख","eekh","sugarcane"], ["उ","u","उल्लू","ullu","owl"], ["ऊ","oo","ऊन","oon","wool"],
  ["ए","e","एक","ek","one"], ["ऐ","ai","ऐनक","ainak","glasses"], ["ओ","o","ओस","os","dew"], ["औ","au","औरत","aurat","woman"],
];
const CONSONANTS = [
  ["क","ka","कमल","kamal","lotus"], ["ख","kha","खरगोश","khargosh","rabbit"], ["ग","ga","गाय","gaay","cow"],
  ["घ","gha","घर","ghar","house"], ["च","cha","चम्मच","chammach","spoon"], ["ज","ja","जल","jal","water"],
  ["ट","ta","टमाटर","tamaatar","tomato"], ["त","ta","तारा","taara","star"], ["द","da","दूध","doodh","milk"],
  ["न","na","नमक","namak","salt"], ["प","pa","पानी","paani","water"], ["ब","ba","बकरी","bakri","goat"],
  ["म","ma","मछली","machhli","fish"], ["र","ra","रोटी","roti","bread"], ["ल","la","लड्डू","laddu","sweet ball"],
  ["व","va","वन","van","forest"], ["स","sa","सेब","seb","apple"], ["ह","ha","हाथी","haathi","elephant"],
];
const ALL = [...VOWELS, ...CONSONANTS];
const PASS_SCORE = 70;

// ---- saved progress (browser only) ----
const todayStr = () => new Date().toDateString();
let save = { xp:0, learned:[], streak:0, lastDay:"" };
try { Object.assign(save, JSON.parse(localStorage.getItem("varnamala") || "{}")); } catch {}
const persist = () => { try { localStorage.setItem("varnamala", JSON.stringify(save)); } catch {} };

function renderStats() {
  document.getElementById("xp").textContent = save.xp;
  document.getElementById("streak").textContent = save.streak;
  document.getElementById("level").textContent = 1 + Math.floor(save.xp / 50);
  document.getElementById("count").textContent = save.learned.length;
  document.getElementById("total").textContent = ALL.length;
  document.getElementById("bar").style.width = (100 * save.learned.length / ALL.length) + "%";
  document.querySelectorAll(".tile").forEach(t => t.classList.toggle("done", save.learned.includes(t.dataset.letter)));
}

function bumpStreak() {
  if (save.lastDay === todayStr()) return;
  const yesterday = new Date(Date.now() - 864e5).toDateString();
  save.streak = save.lastDay === yesterday ? save.streak + 1 : 1;
  save.lastDay = todayStr();
}

function pop(text) {
  const d = document.createElement("div");
  d.className = "pop"; d.textContent = text;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1200);
}

function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.15, ctx.currentTime + i * .12);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + i * .12 + .2);
      o.start(ctx.currentTime + i * .12); o.stop(ctx.currentTime + i * .12 + .2);
    });
  } catch {}
}

// ---- build grids ----
function buildGrid(id, list) {
  const el = document.getElementById(id);
  list.forEach(item => {
    const t = document.createElement("div");
    t.className = "tile"; t.dataset.letter = item[0];
    t.innerHTML = `<b>${item[0]}</b><span>${item[1]}</span>`;
    t.onclick = () => openLesson(item);
    el.appendChild(t);
  });
}
buildGrid("vowels", VOWELS); buildGrid("consonants", CONSONANTS);

// ---- lesson ----
const $ = id => document.getElementById(id);
let current = null;

function openLesson(item) {
  current = item;
  $("lessonTitle").textContent = `Letter ${ALL.indexOf(item) + 1} of ${ALL.length}`;
  $("letter").textContent = item[0];
  $("hint").textContent = `sounds like “${item[1]}”`;
  $("word").textContent = item[2];
  $("meaning").textContent = `${item[3]} · ${item[4]}`;
  applyHints(); showResult("", "");
  $("lesson").classList.add("open");
}
const applyHints = () => {
  const on = $("hintsOn").checked;
  $("hint").classList.toggle("hidden", !on);
  $("meaning").style.visibility = on ? "visible" : "hidden";
};
$("hintsOn").onchange = applyHints;
$("close").onclick = () => { $("lesson").classList.remove("open"); stopRecording(true); };

function showResult(kind, html) {
  const r = $("result"); r.className = kind; r.innerHTML = html;
}

// server errors may be JSON {error} or plain text
async function errorText(res) {
  const text = await res.text();
  try { return JSON.parse(text).error || text; } catch { return `${res.status}: ${text.slice(0, 80)}`; }
}

// ---- Sarvam text-to-speech ----
let player = null;
async function speak(text, pace, btn) {
  if (player) player.pause();
  btn.disabled = true;
  try {
    const res = await fetch("/api/tts", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ text, pace }) });
    if (!res.ok) throw new Error(await errorText(res));
    player = new Audio(URL.createObjectURL(await res.blob()));
    await player.play();
  } catch (e) { showResult("err", `<b>Couldn't play audio</b><small>${e.message}</small>`); }
  btn.disabled = false;
}
$("hearLetter").onclick = e => speak(current[0], 1.0, e.currentTarget);
$("hearWord").onclick = e => speak(current[2], 1.0, e.currentTarget);
$("hearSlow").onclick = e => speak(current[2], 0.7, e.currentTarget);

// ---- Sarvam speech-to-text ----
let recorder = null, chunks = [], stopTimer = null;

function stopRecording(discard) {
  clearTimeout(stopTimer);
  if (recorder && recorder.state === "recording") { recorder.discard = discard; recorder.stop(); }
}

$("mic").onclick = async () => {
  if (recorder && recorder.state === "recording") return stopRecording(false);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    chunks = []; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      $("mic").className = "btn green"; $("mic").textContent = "🎤 Say the word";
      if (!recorder.discard) grade(new Blob(chunks, { type: recorder.mimeType }));
    };
    recorder.start();
    $("mic").className = "btn rec"; $("mic").textContent = "⏹ Tap when done";
    showResult("", "");
    stopTimer = setTimeout(() => stopRecording(false), 6000);
  } catch { showResult("err", "<b>Microphone blocked</b><small>Allow mic access in your browser and try again.</small>"); }
};

// similarity 0-100 using edit distance on the Devanagari text
function similarity(a, b) {
  const m = a.length, n = b.length;
  if (!m || !n) return 0;
  const d = Array.from({ length:m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return Math.round(100 * (1 - d[m][n] / Math.max(m, n)));
}
const clean = s => s.replace(/[^ऀ-ॿ]/g, "");

async function grade(blob) {
  $("mic").disabled = true; showResult("", ""); $("mic").textContent = "Listening…";
  const form = new FormData(); form.append("audio", blob, "speech.webm");
  try {
    const res = await fetch("/api/stt", { method:"POST", body:form });
    if (!res.ok) throw new Error(await errorText(res));
    const data = await res.json();
    const heard = clean(data.transcript), target = clean(current[2]);
    // best match of the target against the whole transcript or any single word in it
    const words = data.transcript.split(/\s+/).map(clean).filter(Boolean);
    const score = Math.max(similarity(heard, target), ...words.map(w => similarity(w, target)), 0);
    if (score >= PASS_SCORE) {
      const first = !save.learned.includes(current[0]);
      if (first) save.learned.push(current[0]);
      save.xp += first ? 10 : 2; bumpStreak(); persist(); renderStats();
      pop(first ? "+10 XP" : "+2 XP"); chime();
      showResult("ok", `<b>Great! ${score}%</b><small>I heard: ${data.transcript || "…"}</small>`);
    } else {
      showResult("bad", `<b>Almost – ${score}%</b><small>I heard: ${data.transcript || "nothing"}. Listen again and retry.</small>`);
    }
  } catch (e) { showResult("err", `<b>Couldn't check your voice</b><small>${e.message}</small>`); }
  $("mic").disabled = false; $("mic").textContent = "🎤 Say the word";
}

renderStats();
</script>
</body>
</html>
